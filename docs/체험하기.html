<title>AOI 검증 — 체험하기</title>
<!--
  체험판 — 실제 앱을 브라우저에서 그대로 따라 해 보는 문서.  파일 하나로 끝난다
  (사내 PC 에서 그냥 열어 보는 용도라 서버도 인터넷도 없다).

  · 색·치수·움직임은 앱의 단일 출처에서 그대로 가져왔다
    (ui/theme.py 의 COLORS·PROFILE, ui/motion.py 의 지속시간·이징).  값을 바꾸려면
    앱을 먼저 고치고 여기에 옮긴다 — 반대로 하면 두 화면이 갈라진다.
  · 글꼴과 사진은 base64 로 박혀 있다.  다시 만들려면:
        python scripts/internal/make_demo_assets.py
    (저장소의 NanumSquare 를 쓰는 글자만 남겨 서브셋하고, 실제 장비 사진을 줄인다.)
  · 폴더 선택·계산·저장은 전부 흉내다.  진짜 파일은 읽지도 쓰지도 않는다.
-->

/* ─────────────────────────────────────────────────────────────
   토큰 — ui/theme.py 의 COLORS(벨럼/흑연) · PROFILE 을 그대로 옮긴 것
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#ECE9E2; --panel:#F5F3ED; --elev:#FBFAF7;
  --line:#89836F; --line2:#B7B2A6; --line-strong:#847F75;
  --ink:#1B1A17; --ink2:#3D3B35; --mute:#5A574E;
  --accent:#2C5A86; --accent-hover:#356B9C; --accent-pressed:#244B70; --on-accent:#F5F3ED;
  --pass:#3B6438; --danger:#A5271E; --warn:#8C4A0F; --focus:#2B4C6F; --thumb-frame:#A39D8F;
  --accent-tint:rgba(44,90,134,.094); --pass-tint:rgba(59,100,56,.118);
  --danger-tint:rgba(165,39,30,.110); --danger-tint-soft:rgba(165,39,30,.059);
  --warn-tint:rgba(140,74,15,.118);
  --scrim:rgba(27,26,23,.329);

  /* PROFILE — 구조 치수 */
  --radius:9px; --radius-sm:6px; --chip-radius:8px;
  --page-margin:32px; --section-gap:28px; --card-pad:20px;
  --control-h:32px; --control-h-lg:44px; --input-h:38px; --target-min:26px;
  --font-base:14px; --font-title:26px; --font-subtitle:15px; --font-caption:12px;
  --title-weight:300; --title-tracking:-1px;
  --chip-w:88px; --chip-h:20px; --thumb:118px; --focus-ring:2px;

  /* 모션 — ui/motion.py.  EASE_PRIMARY 는 Material emphasized-decelerate. */
  --ease:cubic-bezier(.05,.70,.10,1);
  --ease-soft:cubic-bezier(.33,1,.68,1);
  --dur-page:240ms;      /* transition_in — dur(DUR_BASE 300) */
  --dur-sheet:400ms;     /* DUR_SHEET — 스케일하지 않는다 */
  --dur-sheet-out:200ms;
  --dur-switch:160ms;    /* dur(DUR_SWITCH 200) */
  --dur-press:72ms;      /* dur(90) */
  --dur-pulse:320ms;     /* dur(DUR_SLOW 400) */
  --dur-recolor:700ms;   /* DUR_RECOLOR */
  --rise-loading:500ms;  /* DUR_LOADING */
  --fade-loading:300ms;
}
html[data-mode="dark"]{
  --bg:#1C1A15; --panel:#26231C; --elev:#302C24;
  --line:#7C7565; --line2:#3F3A31; --line-strong:#8E8675;
  --ink:#F3F0E8; --ink2:#D4CEC0; --mute:#A8A192;
  --accent:#8FBEEA; --accent-hover:#A6CDF1; --accent-pressed:#76A9DC; --on-accent:#16140F;
  --pass:#8ACB8E; --danger:#FFA398; --warn:#DFC796; --focus:#ABCEF6; --thumb-frame:#6F6859;
  --accent-tint:rgba(143,190,234,.094); --pass-tint:rgba(138,203,142,.118);
  --danger-tint:rgba(255,163,152,.110); --danger-tint-soft:rgba(255,163,152,.059);
  --warn-tint:rgba(223,199,150,.118);
  --scrim:rgba(11,10,8,.376);
}
/* 글꼴은 문서 안의 base64 를 스크립트가 @font-face 로 등록한다 — 여기에 자리표시용
   url() 을 두면 바깥으로 요청이 나가 오류가 찍힌다(파일 하나로 끝나야 한다). */

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:#3A3733; color:var(--ink);
     font-family:"NanumSquare","Malgun Gothic","맑은 고딕",sans-serif;
     font-size:var(--font-base); line-height:1.55;
     display:flex; flex-direction:column; align-items:center; gap:14px;
     padding:14px; overflow-y:scroll}
html[data-mode="dark"] body{background:#100F0C}
.mono{font-family:"JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace}

/* ── 브라우저용 머리말 (앱에는 없는 부분 — 회색으로 구분) ────────────── */
.demobar{width:min(1280px,100%); display:flex; align-items:center; gap:12px;
  color:#D8D3C8; font-size:12.5px; padding:2px 4px; flex-wrap:wrap}
.demobar b{color:#fff; font-size:14px; letter-spacing:-.3px}
.demobar .sp{flex:1}
.demobar button{font:inherit; color:#EDE9E0; background:transparent; cursor:pointer;
  border:1px solid #6E6A62; border-radius:var(--radius-sm); padding:5px 11px}
.demobar button:hover{border-color:#B9B3A6; background:rgba(255,255,255,.06)}

/* ── 앱 창 ──────────────────────────────────────────────────── */
.app{width:min(1280px,100%); height:860px; max-height:calc(100vh - 92px);
  background:var(--bg); border-radius:10px; overflow:hidden; position:relative;
  display:flex; flex-direction:column; box-shadow:0 18px 50px rgba(0,0,0,.45);
  transition:background var(--dur-recolor) var(--ease-soft)}
.stack{flex:1; position:relative; overflow:hidden}
.page{position:absolute; inset:0; display:flex; flex-direction:column; overflow:auto}
.page[hidden]{display:none}
.statusbar{flex:none; height:26px; display:flex; align-items:center; gap:10px;
  padding:0 8px; border-top:1px solid var(--line2); font-size:12px; color:var(--mute)}
.statusbar b{font-weight:600}
.statusbar .sp{flex:1}

/* 페이지 전환 — transition_in: 흐름 방향으로 슬라이드 + 페이드 */
@keyframes pgFwd{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pgBack{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.page.in-fwd{animation:pgFwd var(--dur-page) var(--ease) both}
.page.in-back{animation:pgBack var(--dur-page) var(--ease) both}

/* ── 공통 부품 ──────────────────────────────────────────────── */
.logo{flex:none; display:flex; justify-content:center; padding:10px 0 6px;
  border-bottom:1px solid var(--line2)}
.logo svg{display:block}
.title{font-size:var(--font-title); font-weight:var(--title-weight);
  letter-spacing:var(--title-tracking); margin:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:var(--card-pad)}
.card.soft{background:var(--panel)}
.card-title{font-weight:700; letter-spacing:1px; margin:0 0 12px}
.muted{color:var(--mute)}
.small{font-size:var(--font-caption)}
.row{display:flex; align-items:center; gap:12px}
.grow{flex:1}

button{font:inherit; cursor:pointer}
.btn{font:inherit; background:transparent; color:var(--ink2);
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:6px 14px; font-weight:600; min-height:var(--target-min);
  transition:background .12s linear, border-color .12s linear, opacity var(--dur-press) var(--ease)}
.btn:hover:not(:disabled){background:var(--elev); color:var(--ink); border-color:var(--accent)}
.btn:active:not(:disabled){opacity:.92}
.btn:focus-visible{outline:var(--focus-ring) solid var(--focus); outline-offset:1px}
.btn[data-role="primary"]{background:var(--accent); color:var(--on-accent);
  border-color:var(--accent); font-weight:700; min-height:30px}
.btn[data-role="primary"]:hover:not(:disabled){background:var(--accent-hover); color:var(--on-accent)}
.btn[data-role="primary"]:focus-visible{outline-color:var(--on-accent); outline-offset:-4px}
.btn[data-role="danger"]{color:var(--danger); border-color:var(--danger)}
.btn[data-role="danger"]:hover:not(:disabled){background:var(--danger-tint); color:var(--danger)}
.btn[data-role="warn"]{color:var(--warn); border-color:var(--warn)}
.btn[data-role="warn"]:hover:not(:disabled){background:var(--warn-tint); color:var(--warn)}
.btn[data-role="link"]{border:none; color:var(--mute); padding:3px 4px;
  font-size:var(--font-caption); min-height:0}
.btn[data-role="link"]:hover{color:var(--ink); background:var(--elev)}
.btn[data-role="rowAction"]{padding:3px 8px; font-size:var(--font-caption); min-height:var(--target-min)}
.btn:disabled{color:color-mix(in srgb,var(--mute) 55%,var(--bg));
  border-style:dashed; border-color:color-mix(in srgb,var(--line) 55%,var(--bg));
  background:transparent; cursor:default}
.btn[data-role="primary"]:disabled{background:transparent; color:color-mix(in srgb,var(--mute) 55%,var(--bg))}

/* 세그먼트 / 타일 — OptionGroup */
.seg{display:flex; gap:4px}
.seg .btn{min-height:34px; padding:4px 14px; font-size:var(--font-caption); justify-content:center}
.opt{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opt .btn{min-height:var(--control-h-lg); text-align:left; justify-content:flex-start}
.btn[aria-pressed="true"]{background:var(--accent-tint); border-color:var(--accent);
  color:var(--accent); font-weight:700}

/* 입력 */
.input{font:inherit; color:var(--ink); background:var(--elev);
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:7px 12px; height:var(--input-h); min-width:0}
.input::placeholder{color:var(--mute)}
.input:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 1px var(--focus)}
.input[data-state="invalid"]{border-color:var(--danger); background:var(--danger-tint-soft)}
.err{color:var(--danger); font-size:var(--font-caption); min-height:16px}

/* 스위치 — ToggleSwitch 48×28, 노브 지름 h−6 */
.sw{width:48px; height:28px; border-radius:14px; border:none; padding:0; position:relative;
  background:var(--line-strong); cursor:pointer; flex:none;
  transition:background var(--dur-switch) var(--ease)}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px;
  border-radius:50%; background:var(--on-accent);
  transition:transform var(--dur-switch) var(--ease)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sw:disabled{background:var(--line); cursor:default}
.sw:focus-visible{outline:var(--focus-ring) solid var(--on-accent); outline-offset:-4px}
.swrow{display:flex; align-items:center; gap:12px; min-height:34px}

/* 칩 — 성공은 침묵(빈 칸 유지) */
.chip{display:inline-flex; align-items:center; justify-content:center;
  width:var(--chip-w); height:var(--chip-h); border-radius:var(--chip-radius);
  font-size:var(--font-caption); font-weight:700; flex:none}
.chip[data-chip="over"]{color:var(--danger); background:var(--danger-tint)}
.chip[data-chip="none"]{color:var(--mute); border:1px solid var(--line2)}

/* 썸네일 */
.thumb{border:1px solid var(--thumb-frame); border-radius:var(--radius-sm); display:block;
  object-fit:cover; background:var(--bg)}
.thumb[data-subtle="true"]{border-style:dashed}

/* ── 셋업 화면 ──────────────────────────────────────────────── */
.setup-scroll{flex:1; overflow:auto; padding:var(--page-margin);
  display:flex; flex-direction:column; gap:var(--section-gap)}
.cards2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.field{display:grid; grid-template-columns:92px 1fr auto; gap:10px; align-items:center}
.badge{border:1px solid var(--line); border-radius:var(--radius); padding:10px 16px;
  background:var(--panel); transition:border-color .2s linear, background .2s linear}
.badge[data-state="legacy"]{border:2px solid var(--warn); background:var(--warn-tint)}
.badge .cap{font-size:var(--font-caption); font-weight:700; letter-spacing:1px; color:var(--ink2)}
.badge .val{font-size:var(--font-subtitle); font-weight:700}
.actionbar{flex:none; border-top:1px solid var(--line);
  padding:12px var(--page-margin) 16px; display:flex; align-items:center; gap:10px}
.stepper{width:38px; height:38px; padding:0; font-size:17px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center}
.disabled-row{opacity:.55; pointer-events:none}

/* 접이식 */
.disc{border:none; background:transparent; color:var(--ink2); font-weight:600;
  padding:4px 6px; border-radius:var(--radius-sm)}
.disc:hover{background:var(--elev); box-shadow:inset 0 0 0 1px var(--line-strong)}
.collapse{overflow:hidden; transition:height var(--dur-page) var(--ease)}

/* ── 3분할 / 2분할 ──────────────────────────────────────────── */
.panes{flex:1; display:flex; gap:10px; padding:0 16px 10px; min-height:0}
.pane{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px; display:flex; flex-direction:column; gap:8px; min-height:0}
.pane h3{margin:0; font-size:var(--font-base); font-weight:700}
.pane-body{overflow:auto; min-height:0; flex:1}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{border:1px solid var(--line2); border-radius:var(--radius-sm); padding:5px;
  background:var(--elev); cursor:pointer; text-align:center}
.tile img{width:100%; height:auto; border-radius:3px; display:block}
.tile .cap{font-size:11px; color:var(--mute); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile[aria-selected="true"]{border:2px solid var(--accent); padding:4px; background:var(--accent-tint)}
.viewport{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius); padding:10px}
.viewport img{max-width:100%; max-height:100%; border-radius:4px}
.slot-head{font-weight:700; color:var(--ink2); font-size:13px; margin:8px 0 4px}

/* ── 검토 화면 (제도 시트) ──────────────────────────────────── */
.review-top{flex:none; display:flex; align-items:center; gap:12px; padding:12px 20px}
.tally{font-size:13px}
.tally .n{font-family:"JetBrains Mono",Consolas,monospace; font-weight:700}
.tally .sep{color:var(--line2); margin:0 6px}
.colhead{flex:none; display:flex; gap:12px; padding:5px 21px;
  border-bottom:1px solid var(--line); font-size:var(--font-caption);
  font-weight:700; letter-spacing:1px; color:var(--mute)}
.rows{flex:1; overflow:auto; padding:0 20px 12px}
.mrow{display:flex; gap:12px; align-items:center; padding:8px 10px;
  border-bottom:1px solid var(--line); border:1px solid transparent;
  border-bottom-color:var(--line)}
.mrow[data-state="over"]{background:var(--danger-tint-soft); border:1px solid var(--danger)}
.mrow[data-state="unmatched"]{background:var(--panel); border:2px solid var(--danger)}
.mrow .slotcol{width:96px; flex:none; display:flex; flex-direction:column; gap:5px}
.mrow .slotcol b{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .arrow{width:24px; flex:none; text-align:center; color:var(--mute); font-size:20px}
.mrow .cell{display:flex; flex-direction:column; align-items:center; gap:3px; flex:none}
.mrow .cell .sc{font-family:"JetBrains Mono",Consolas,monospace; font-size:12px; color:var(--ink2)}
.mrow .cell .sc[data-over="true"]{color:var(--danger)}
.mrow .runners{display:flex; gap:12px; flex-wrap:wrap; flex:1; min-width:0}
.mrow .vrule{width:1px; align-self:stretch; background:rgba(27,26,23,.22); flex:none}
html[data-mode="dark"] .mrow .vrule{background:rgba(243,240,232,.22)}
.mrow .metric{width:96px; flex:none; text-align:right;
  font-family:"JetBrains Mono",Consolas,monospace; font-weight:700; font-size:13px}
.mrow .metric[data-over="true"]{color:var(--danger)}
.runner{cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px}
@keyframes rowPulse{from{box-shadow:inset 0 0 0 999px rgba(165,39,30,.25)}to{box-shadow:none}}
.mrow.pulse{animation:rowPulse var(--dur-pulse) var(--ease) both}

/* ── 로딩 오버레이 ──────────────────────────────────────────── */
.loading{position:absolute; inset:0; z-index:40; display:none;
  align-items:center; justify-content:center; background:var(--scrim)}
.loading.on{display:flex; animation:fadeIn var(--fade-loading) linear both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{transform:translateY(32px)}to{transform:none}}
.loadpanel{width:424px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:24px 28px; display:flex; flex-direction:column;
  align-items:center; gap:12px; animation:riseIn var(--rise-loading) cubic-bezier(.25,.46,.45,.94) both}
.spinner{width:56px; height:56px}
.spinner circle{fill:none; stroke-width:4; stroke-linecap:round}
.spinner .track{stroke:var(--line2)}
.spinner .arc{stroke:var(--accent); transform-origin:50% 50%;
  animation:spin 1.15s linear infinite, breathe 2.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{stroke-dasharray:34 141}50%{stroke-dasharray:53 141}}
.loadmsg{width:360px; text-align:center; font-size:var(--font-subtitle); color:var(--ink2)}
.bar{width:360px; height:8px; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius-sm); overflow:hidden}
.bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:5px}
.count{font-family:"JetBrains Mono",Consolas,monospace; font-size:var(--font-caption); color:var(--ink2)}
/* busy — 혜성 스윕: 진행 방향 앞쪽이 머리(알파 .45/.7/1) */
.comet{width:360px; height:6px; border-radius:3px; background:var(--line2); overflow:hidden}
.comet > i{display:block; height:100%; width:24%; border-radius:3px;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--accent) 45%,transparent) 0%,
    color-mix(in srgb,var(--accent) 70%,transparent) 55%,
    var(--accent) 100%);
  animation:sweep 880ms linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(417%)}}

/* ── 시트 (창 안 팝업) ──────────────────────────────────────── */
.sheets{position:absolute; inset:0; z-index:60; display:none}
.sheets.on{display:block}
.sheet-scrim{position:absolute; inset:0; background:var(--scrim);
  animation:fadeIn var(--dur-sheet-out) var(--ease) both}
.sheet{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:var(--elev); border:2px solid var(--line-strong); border-radius:var(--radius);
  display:flex; flex-direction:column; max-width:calc(100% - 24px); max-height:calc(100% - 24px);
  animation:sheetIn var(--dur-sheet) var(--ease) both}
.sheet[data-full="true"]{left:8px; top:8px; right:8px; bottom:8px;
  transform:none; max-width:none; max-height:none; width:auto; height:auto}
@keyframes sheetIn{from{opacity:0; transform:translate(-50%,calc(-50% + 18px))}
                   to{opacity:1; transform:translate(-50%,-50%)}}
@keyframes sheetInFull{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
.sheet[data-full="true"]{animation-name:sheetInFull}
.sheet.out{animation:sheetOut var(--dur-sheet-out) var(--ease) both}
@keyframes sheetOut{to{opacity:0}}
.sheetbar{flex:none; display:flex; align-items:center; gap:10px;
  padding:8px 8px 8px 14px; border-bottom:1px solid var(--line)}
.sheetbar h2{margin:0; font-size:var(--font-subtitle); font-weight:700; flex:1}
.sheetbody{padding:20px 24px; overflow:auto; display:flex; flex-direction:column; gap:14px}
.sheetbody h3{margin:0; font-size:var(--font-subtitle); font-weight:700}
.sheetbody p{margin:0; color:var(--ink2); max-width:560px}
.sheetfoot{display:flex; justify-content:flex-end; gap:8px}

/* 가상 폴더 선택 */
.crumbs{display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px}
.folders{display:flex; flex-direction:column; gap:6px; min-width:420px}
.folder{display:flex; align-items:center; gap:10px; padding:9px 12px; text-align:left;
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  background:transparent; color:var(--ink); font:inherit; cursor:pointer}
.folder:hover{background:var(--elev); border-color:var(--accent)}
.folder .n{flex:1; font-weight:600}
.folder .d{color:var(--mute); font-size:var(--font-caption)}

/* 슬롯 타일 */
.slotgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-height:320px; overflow:auto}
.slottile{min-height:36px; text-align:left; padding:6px 10px}

/* ── 안내 투어 ──────────────────────────────────────────────── */
.tour{position:fixed; inset:0; z-index:90; display:none; pointer-events:none}
.tour.on{display:block}
.tour svg{position:absolute; inset:0; width:100%; height:100%}
.tour .ring{position:absolute; border:2px solid var(--focus); border-radius:8px;
  pointer-events:none; transition:all var(--dur-page) var(--ease)}
.tourcard{position:absolute; width:min(430px,calc(100vw - 32px)); pointer-events:auto;
  background:var(--elev); border:2px solid var(--line-strong); border-radius:var(--radius);
  color:var(--ink); box-shadow:0 14px 40px rgba(0,0,0,.35);
  transition:left var(--dur-page) var(--ease), top var(--dur-page) var(--ease)}
.tourcard .hd{display:flex; align-items:center; gap:8px; padding:9px 12px;
  border-bottom:1px solid var(--line)}
.tourcard .hd b{flex:1; font-size:var(--font-subtitle)}
.tourcard .step{font-family:"JetBrains Mono",Consolas,monospace; font-size:12px; color:var(--mute)}
.tourcard .bd{padding:13px 16px; color:var(--ink2); font-size:13.5px}
.tourcard .bd em{font-style:normal; font-weight:700; color:var(--accent)}
.tourcard .ft{display:flex; gap:8px; align-items:center; padding:0 16px 14px}
.tourcard .ft .sp{flex:1}
.tourcard[data-kind="warn"]{border-color:var(--warn)}
.tourcard[data-kind="warn"] .bd em{color:var(--warn)}

/* 상태바 알림 — 앱과 같은 자리(떠 있는 알약이 버튼을 가렸다) */
.note-slot{color:var(--accent); font-weight:600; opacity:0; margin-left:12px;
  transition:opacity var(--dur-page) var(--ease)}
.note-slot.on{opacity:1}

/* 완료 도장 */
@keyframes stamp{0%{opacity:0; transform:scale(1.5) rotate(-8deg)}
                 60%{opacity:1; transform:scale(.96) rotate(-8deg)}
                 100%{opacity:1; transform:scale(1) rotate(-8deg)}}
.stamp{border:3px solid var(--pass); color:var(--pass); border-radius:var(--radius);
  padding:8px 18px; font-weight:700; font-size:19px; letter-spacing:1px;
  animation:stamp var(--dur-pulse) var(--ease) both; display:inline-block}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important; animation-iteration-count:1 !important;
    transition-duration:1ms !important}
}
@media (max-width:900px){
  .cards2{grid-template-columns:1fr}
  .panes{flex-direction:column}
  .slotgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="demobar">
  <b>AOI 검증 — 체험하기</b>
  <span>실제 프로그램과 같은 화면·움직임입니다. 파일은 저장되지 않습니다.</span>
  <span class="sp"></span>
  <button id="btn-help" data-test="help">이럴 땐?</button>
  <button id="btn-tour" data-test="tour-open">안내 다시 보기</button>
  <button id="btn-reset" data-test="reset">처음부터</button>
</div>

<div class="app" id="app">
  <div class="stack" id="stack"></div>
  <div class="statusbar"><b>Developed by 임현택</b>
    <span id="note" class="note-slot" data-test="toast"></span><span class="sp"></span>
    <span class="mono" id="mem">메모리 사용량: 412 MB</span></div>

  <div class="loading" id="loading" data-test="loading">
    <div class="loadpanel">
      <svg class="spinner" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="track" cx="28" cy="28" r="22"/>
        <circle class="arc" cx="28" cy="28" r="22" stroke-dasharray="42 141"/>
      </svg>
      <div class="loadmsg" id="load-msg"></div>
      <div id="load-bars"></div>
    </div>
  </div>

  <div class="sheets" id="sheets"></div>
</div>

<div class="tour" id="tour" aria-live="polite">
  <svg aria-hidden="true"><defs><mask id="spot">
    <rect id="spot-all" x="0" y="0" width="100%" height="100%" fill="#fff"/>
    <rect id="spot-hole" x="0" y="0" width="0" height="0" rx="8" fill="#000"/>
  </mask></defs>
  <rect x="0" y="0" width="100%" height="100%" fill="rgba(16,15,12,.55)" mask="url(#spot)"/></svg>
  <div class="ring" id="tour-ring"></div>
  <div class="tourcard" id="tour-card" data-test="tour-card">
    <div class="hd"><b id="tour-title"></b><span class="step" id="tour-step"></span></div>
    <div class="bd" id="tour-body"></div>
    <div class="ft">
      <button class="btn" data-role="link" id="tour-skip" data-test="tour-skip">건너뛰기</button>
      <span class="sp"></span>
      <button class="btn" id="tour-prev" data-test="tour-prev">이전</button>
      <button class="btn" data-role="primary" id="tour-next" data-test="tour-next">다음</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   자산 · 소도구
   ═══════════════════════════════════════════════════════════════ */
const A = JSON.parse(document.getElementById("assets").textContent || "{}");
const IMG = {};
for (const [k, v] of Object.entries(A.shots || {})) IMG[k] = "data:image/jpeg;base64," + v;
if (A.fonts) {
  const face = (w, b) =>
    `@font-face{font-family:"NanumSquare";font-weight:${w};font-style:normal;` +
    `src:url(data:font/woff2;base64,${b}) format("woff2")}`;
  const st = document.createElement("style");
  st.textContent = face(400, A.fonts.regular) + face(700, A.fonts.bold);

   ═══════════════════════════════════════════════════════════════ */
const Loading = {
  node: $("#loading"), msg: $("#load-msg"), bars: $("#load-bars"), shownAt: 0,
  busy(text) {
    this.msg.textContent = text;
    this.bars.innerHTML = "";
    this.bars.appendChild(el("div", { class: "comet" }, [el("i")]));
    this.node.classList.add("on");
    this.shownAt = Date.now();
  },
  progress(done, total, text) {
    this.msg.textContent = text;
    if (!this.bars.querySelector(".bar")) {
      this.bars.innerHTML = "";
      const wrap = el("div", { style: "display:flex;flex-direction:column;align-items:center;gap:6px" }, [
        el("div", { class: "bar" }, [el("i")]), el("div", { class: "count" }),
      ]);
      this.bars.appendChild(wrap);
    }
    // 결정형 채움은 **스냅이 기본**이다(로딩바 계약) — 진행률은 장식이 아니라 정보다.
    this.bars.querySelector(".bar > i").style.width = Math.round((done / total) * 100) + "%";
    this.bars.querySelector(".count").textContent = done + " / " + total;
  },
  async hide() {
    const left = 350 - (Date.now() - this.shownAt);   // 최소 표시 래치
    if (left > 0) await wait(left);
    this.node.classList.remove("on");
  },
};

const Sheets = {
  host: $("#sheets"), stack: [],
  open({ title, body, foot, full, onEsc }) {
    if (!this.stack.length) this.host.appendChild(el("div", { class: "sheet-scrim" }));
    this.host.classList.add("on");
    const sheet = el("div", { class: "sheet", "data-full": full ? "true" : null, "data-test": "sheet" });
    if (title) {
      sheet.appendChild(el("div", { class: "sheetbar" }, [

    const bd = el("div", { class: "sheetbody" }, [].concat(body || []));
    if (foot) bd.appendChild(el("div", { class: "sheetfoot" }, foot));
    sheet.appendChild(bd);
    this.host.appendChild(sheet);
    this.stack.push({ sheet, onEsc });
    return sheet;
  },
  close() {
    const top = this.stack.pop();

    const done = () => {
      top.sheet.remove();
      if (!this.stack.length) { this.host.innerHTML = ""; this.host.classList.remove("on"); }

  closeAll() { while (this.stack.length) this.close(); },
};

    okBtn.disabled = chosen.size === 0;
  };
  SLOTS.forEach((n) => grid.appendChild(el("button", {
    class: "btn slottile", text: n, "data-test": "slot-" + n,
    "aria-pressed": chosen.has(n) ? "true" : "false",
    on: { click: (e) => {
      if (chosen.has(n)) chosen.delete(n); else chosen.add(n);
      e.currentTarget.setAttribute("aria-pressed", chosen.has(n) ? "true" : "false");
      sync();
    } } })));
  const okBtn = el("button", { class: "btn", "data-role": "primary", text: "확인",
    "data-test": "slot-ok", on: { click: () => {
      S.chosenSlots = SLOTS.filter((n) => chosen.has(n));
      S.scope = S.chosenSlots.length === SLOTS.length ? "all" : "sub";
      Sheets.close(); go("setup");
    } } });
  Sheets.open({
    title: "진행할 슬롯 선택",
    body: [head, el("p", { class: "small muted", text:
      "이번 검증에서 진행할 슬롯을 눌러 고르세요. 고르지 않은 슬롯은 스캔·매칭에서 제외됩니다." }), grid],
    foot: [el("button", { class: "btn", text: "취소", on: { click: () => Sheets.close() } }), okBtn],
  });
}

/* ═══════════════════════════════════════════════════════════════
   검증 시작 — 스캔 → KLA 확인 → 1단계(또는 2단계)
   ═══════════════════════════════════════════════════════════════ */
async function startRun() {
  S.started = true;
  Loading.busy("폴더 스캔 중…");
  await wait(900);
  const total = S.chosenSlots.length * 6;
  for (let i = 1; i <= total; i += 3) {
    Loading.progress(i, total, `폴더 스캔 중… ${i} / ${total} 슬롯`);
    await wait(90);
  }
  Loading.progress(total, total, `폴더 스캔 중… ${total} / ${total} 슬롯`);
  await Loading.hide();

  const side = await ask({
    title: "KLA 장비 확인", heading: "KLA 장비가 어느 쪽인가요?",
    text: "KLA(WaferID) 장비 위치를 선택하세요. 없으면 ‘KLA 아님’.",
    options: [{ v: "ref", t: "기준" }, { v: "val", t: "검증" },
              { v: "both", t: "둘다" }, { v: "none", t: "KLA 아님" }],
  });
  if (side && side !== "none") toast("KLA 폴더의 WaferID 로 슬롯을 묶었습니다.");

  Loading.busy("썸네일 생성 중…");
  await wait(700);
  await Loading.hide();

  S.stage1 = { queue: PHOTOS.slice(), keep: [], drop: [] };
  if (S.auto === "all") { S.stage1.keep = PHOTOS.slice(); return startMatch(); }
  go("select");
}

/* ═══════════════════════════════════════════════════════════════
   2) 1단계 — 후보 선별
   ═══════════════════════════════════════════════════════════════ */
function decide(kind) {
  const cur = S.stage1.queue.shift();
  if (!cur) return;
  (kind === "keep" ? S.stage1.keep : S.stage1.drop).push(cur);
  if (!S.stage1.queue.length) { toast("후보 선별이 끝났습니다. 매칭으로 넘어갑니다."); return startMatch(); }
  go("select");
}
RENDER.select = () => {

  page.appendChild(logoBar());
  const cur = S.stage1.queue[0];
  const done = S.stage1.keep.length + S.stage1.drop.length;

  page.appendChild(el("div", { class: "row", style: "padding:10px 16px" }, [
    el("h1", { class: "title", style: "font-size:22px", text: "Stage 1 — 후보 선별" }),
    el("div", { class: "grow" }),
    el("button", { class: "btn", text: `검증 제외 사진 보기 (${S.stage1.drop.length})`,
      disabled: S.stage1.drop.length ? null : true }),
    el("button", { class: "btn", "data-role": "warn", text: "선택 종료", "data-test": "end-select",
      on: { click: () => Sheets.open({
        title: "선택 종료",
        body: [el("p", { text: `남은 ${S.stage1.queue.length} 장의 미결정 사진을 모두 ‘검증 제외’ 로 처리하고 다음 단계로 진행할까요?` })],
        foot: [el("button", { class: "btn", text: "아니오", on: { click: () => Sheets.close() } }),
               el("button", { class: "btn", "data-role": "primary", text: "예", "data-test": "end-yes",
                 on: { click: () => { S.stage1.drop.push(...S.stage1.queue); S.stage1.queue = []; Sheets.close(); startMatch(); } } })],
      }) } }),
    el("span", { class: "muted mono", text: `W7548304XYG4 · ${done} / ${PHOTOS.length}` }),
  ]));

  const panel = (title, items, sel) => el("div", { class: "pane", style: "flex:2", "data-test": "pane-" + sel }, [
    el("div", { class: "row" }, [el("h3", { text: title }), el("div", { class: "grow" }),
      el("button", { class: "btn", text: "선택 모드" })]),
    el("div", { class: "pane-body" }, [
      el("div", { class: "slot-head", text: `W7548304XYG4  ·  ${items.length} 장` }),
      el("div", { class: "tiles c2" }, items.map((p) => el("div", { class: "tile" }, [
        el("img", { src: p.ref, alt: "" }), el("div", { class: "cap", text: p.name.slice(0, 14) })]))),
    ]),
  ]);

  page.appendChild(el("div", { class: "panes" }, [
    panel("검증 후보들 (남은 사진)", S.stage1.queue, "left"),
    el("div", { class: "pane", style: "flex:4" }, [
      el("h3", { style: "text-align:center", text: "검증 결정할 사진" }),
      el("div", { class: "muted small", style: "text-align:center", text: "Slot: W7548304XYG4" }),
      sizeRow(),
      el("div", { class: "viewport" }, [cur
        ? el("img", { src: cur.mid, alt: "", "data-test": "center-img",
                      width: S.imgSize, height: S.imgSize }) : null]),
      el("div", { class: "row" }, [
        el("button", { class: "btn", text: "되돌리기(Z)", title: "단축키:  ← 또는 1 = 검증   /   → 또는 2 = 제외   /   Z = 되돌리기" }),
        el("div", { class: "grow" }),
        el("button", { class: "btn", "data-role": "primary", text: "✓  검증", "data-test": "verify",
          title: "단축키:  ← 또는 1 = 검증", on: { click: () => decide("keep") } }),
        el("button", { class: "btn", "data-role": "danger", text: "✕  제외", "data-test": "exclude",
          title: "단축키:  → 또는 2 = 제외", on: { click: () => decide("drop") } }),
      ]),
    ]),
    panel("검증 대상 (검증하기로 한 사진들)", S.stage1.keep, "right"),
  ]));
  return page;
};

/* ═══════════════════════════════════════════════════════════════
   3) 2단계 — 매칭
   ═══════════════════════════════════════════════════════════════ */
async function startMatch() {
  Loading.busy("첫 슬롯 준비 중… 잠시만 기다려 주세요.");
  await wait(800);
  const q = S.stage1.keep.length ? S.stage1.keep : PHOTOS.slice();
  for (let i = 1; i <= q.length; i++) {
    Loading.progress(i, q.length, `좌표 매칭 중… ${i} / ${q.length}`);
    await wait(140);
  }
  await Loading.hide();
  S.stage2 = { queue: q.slice(), matches: [] };
  if (S.auto === "all") {
    S.stage2.matches = q.map((p) => ({ p, val: p.val, vname: p.vname, dist: p.dist, none: false }));
    S.stage2.queue = [];
    return buildReview();
  }
  go("match");
}
function matchPick(val, vname, dist, none) {
  const p = S.stage2.queue.shift();
  S.stage2.matches.push({ p, val, vname, dist, none: !!none });
  if (!S.stage2.queue.length) return buildReview();
  go("match");
}
RENDER.match = () => {
  const page = el("div", { class: "page" });
  page.appendChild(logoBar());
  const cur = S.stage2.queue[0];
  // 20 µm 이내면 '거의 정확히 일치' 로 보고 후보를 한 장만 보여 준다.
  const confident = cur.dist <= 20;
  const cands = confident
    ? [{ img: cur.val, name: cur.vname, dist: cur.dist }]
    : [{ img: cur.val, name: cur.vname, dist: cur.dist },
       { img: cur.alt, name: PHOTOS[(cur.id % 6)].vname, dist: cur.dist + 260 },
       { img: PHOTOS[(cur.id + 1) % 6].val, name: PHOTOS[(cur.id + 1) % 6].vname, dist: cur.dist + 640 }];

  page.appendChild(el("div", { class: "row", style: "padding:10px 16px" }, [
    el("button", { class: "btn", text: "← 설정으로", on: { click: () => { S.started = false; go("setup"); } } }),
    el("h1", { class: "title", style: "font-size:22px", text: "Stage 2 — 유사도 기반 매칭" }),
    el("div", { class: "grow" }),
    el("span", { class: "muted", text: "Stage 2 — 좌표 기반 매칭 (v2)" }),
    el("span", { class: "muted mono", style: "margin-left:16px",
      text: `${S.stage2.matches.length + 1} / ${S.stage2.matches.length + S.stage2.queue.length}` }),
  ]));

  page.appendChild(el("div", { class: "panes" }, [
    el("div", { class: "pane", style: "flex:4" }, [
      el("h3", { style: "text-align:center", text: "기준 사진" }),
      el("div", { class: "muted small", style: "text-align:center", text: "Slot: W7548304XYG4" }),
      sizeRow(),
      el("div", { class: "viewport" }, [el("img", { src: cur.mid, alt: "", "data-test": "center-img",
        width: S.imgSize, height: S.imgSize })]),
      el("div", { class: "row" }, [
        el("button", { class: "btn", text: "되돌리기", title: "직전 매칭/매칭없음 결정을 취소합니다 (Ctrl+Z)" }),
        el("div", { class: "grow" }),
        el("button", { class: "btn", "data-role": "danger", text: "매칭 없음", "data-test": "nomatch",
          title: "단축키:  N = 매칭 없음 확정", on: { click: () => matchPick(null, null, null, true) } }),
      ]),
    ]),
    el("div", { class: "pane", style: "flex:3", "data-test": "cands" }, [
      el("h3", { text: "검증 장비 후보" }),
      confident ? el("div", { class: "small muted", text:
        `가장 가까운 후보가 ${cur.dist} µm — 사실상 같은 결함이라 한 장만 보여 줍니다.` }) : null,
      el("div", { class: "pane-body" }, [
        el("div", { class: "tiles c2" }, cands.map((c) =>
          el("div", { class: "tile", "data-test": "cand", on: { click: () => matchPick(c.img, c.name, c.dist) } }, [
            el("img", { src: c.img, alt: "" }),
            el("div", { class: "cap", text: c.name.slice(0, 22) })]))),
      ]),
    ]),
  ]));
  return page;
};

/* ═══════════════════════════════════════════════════════════════
   4) 검토 — 제도 시트
   ═══════════════════════════════════════════════════════════════ */
function buildReview() {
  S.review = S.stage2.matches.map((m) => ({
    slot: "W7548304XYG4", name: m.p.name, ref: m.p.ref,
    val: m.val, vname: m.vname, dist: m.dist,
    none: m.none, alt: m.p.alt, altDist: (m.dist || 0) + 260,
  })).sort((a, b) => (b.dist || 0) - (a.dist || 0));   // 먼 것 먼저 — 확인이 필요한 것부터
  S.unmatched = 1;
  go("review");
}
const verdictOf = (r) => r.none ? "unmatched" : (r.dist > S.tol ? "over" : "ok");
RENDER.review = () => {
  const page = el("div", { class: "page" });
  const counts = { ok: 0, over: 0, unmatched: 0 };
  S.review.forEach((r) => counts[verdictOf(r)]++);

  const tally = el("div", { class: "tally", "data-test": "tally", html:
    `<span style="color:var(--pass)">일치 <span class="n">${counts.ok}</span></span>` +
    (counts.over ? `<span class="sep">··</span><span style="color:var(--danger)">허용 초과 <span class="n">${counts.over}</span></span>` : "") +
    (counts.unmatched ? `<span class="sep">··</span><span style="color:var(--ink2)">매치 없음 <span class="n">${counts.unmatched}</span></span>` : "") +
    `<span class="sep">··</span><span class="muted">매치 실패 <span class="n">${S.unmatched}</span></span>` });

  page.appendChild(el("div", { class: "review-top" }, [
    tally, el("div", { class: "grow" }),
    el("button", { class: "btn", "data-role": "primary", "data-test": "finish",
      text: `검토 완료 · 유지 ${S.review.filter((r) => !r.none).length}`,
      style: "min-height:38px", on: { click: () => finishReview() } }),
  ]));
  page.appendChild(el("div", { class: "colhead" }, [
    el("span", { style: "width:96px", text: "슬롯" }),
    el("span", { style: `width:${118}px;text-align:center`, text: "기준" }),
    el("span", { style: "width:24px" }),
    el("span", { style: `width:${118}px;text-align:center`, text: "검증" }),
    el("span", { class: "grow", text: "후보" }),
    el("span", { style: "width:96px;text-align:right", text: "거리(µm)" }),
    el("span", { style: "width:88px;text-align:center", text: "판정" }),
    el("span", { style: "width:52px" }),
  ]));

  const rows = el("div", { class: "rows", "data-test": "rows" });
  S.review.forEach((r, i) => {
    const v = verdictOf(r);
    const row = el("div", { class: "mrow", "data-test": "mrow",
      "data-state": v === "ok" ? null : v });
    row.appendChild(el("div", { class: "slotcol" }, [
      el("b", { text: r.slot }),
      el("button", { class: "btn", "data-role": "rowAction", text: "크게 보기", "data-test": "bigger",
        on: { click: () => compare(r) } }),
    ]));
    row.appendChild(el("div", { class: "cell" }, [
      el("img", { class: "thumb", src: r.ref, width: "118", height: "118", alt: "" })]));
    row.appendChild(el("div", { class: "arrow", text: "→" }));
    row.appendChild(el("div", { class: "cell" }, v === "unmatched" ? [
      el("div", { style: "width:118px;height:118px" })
    ] : [
      el("img", { class: "thumb", src: r.val, width: "118", height: "118", alt: "" }),
      el("div", { class: "sc", "data-over": r.dist > S.tol ? "true" : null, text: r.dist + " µm" }),
    ]));
    // 차순위 후보 — 점선 테두리(아직 확정 아님).  클릭하면 짝이 교체된다.
    row.appendChild(el("div", { class: "runners" }, v === "unmatched" ? [] : [
      el("div", { class: "runner", "data-test": "runner", title: "클릭하면 이 사진으로 매치를 교체합니다.",
        on: { click: () => {
          const keepDist = r.altDist;
          [r.val, r.alt] = [r.alt, r.val];
          r.altDist = r.dist; r.dist = keepDist;
          go("review");
          const nodes = document.querySelectorAll('[data-test="mrow"]');
          if (nodes[i]) { nodes[i].classList.add("pulse"); }
          toast("이 후보로 매치를 교체했습니다.");
        } } }, [
        el("img", { class: "thumb", src: r.alt, "data-subtle": "true", width: "94", height: "94", alt: "" }),
        el("div", { class: "sc", text: r.altDist + " µm" })]),
    ]));
    row.appendChild(el("div", { class: "vrule" }));
    row.appendChild(el("div", { class: "metric", "data-over": r.dist > S.tol ? "true" : null,
      text: v === "unmatched" ? "—" : r.dist + " µm" }));
    row.appendChild(el("span", { class: "chip", "data-chip": v === "ok" ? null : (v === "over" ? "over" : "none"),
      text: v === "over" ? "허용 초과" : (v === "unmatched" ? "매치 없음" : "") }));
    row.appendChild(el("button", { class: "btn", "data-test": "toggle",
      style: "width:52px;height:44px;padding:0;font-size:17px;font-weight:700",
      text: r.none ? "↩" : "×", title: r.none ? "되돌리기 ↩" : "매치 없음 ✕",
      on: { click: () => { r.none = !r.none; go("review"); } } }));
    rows.appendChild(row);
  });
  page.appendChild(rows);
  return page;
};

function compare(r) {

      [el("img", { src, alt: "", style: "max-width:100%;max-height:100%" })]),

  Sheets.open({

    body: [
      el("div", { class: "row" }, [
        el("span", { class: "mono muted", text: "1 / 2" }), el("div", { class: "grow" }),
        el("span", { class: "small muted", text: "← → 후보 이동 · 휠 확대/축소 · 드래그 이동 (사진마다 따로)" }),
        el("button", { class: "btn", "data-role": "primary", text: "이 후보로 매치",
          on: { click: () => { Sheets.close(); toast("이 후보로 매치했습니다."); } } }),
      ]),
      el("div", { style: "flex:1;display:flex;gap:16px;min-height:340px" }, [
        pane("기준 — " + r.name.slice(0, 18), IMG.big_ref),
        pane(r.dist + " µm", IMG.big_val)]),
    ],
  });
}

function finishReview() {
  const kept = S.review.filter((r) => !r.none);
  S.result = { kept: kept.length, miss: S.review.length - kept.length + S.unmatched };
  go("result");
}

/* ═══════════════════════════════════════════════════════════════
   5) 결과
   ═══════════════════════════════════════════════════════════════ */
RENDER.result = () => {
  const page = el("div", { class: "page", style: "padding:40px;gap:20px" });
  page.appendChild(logoBar());

   단축키 — 앱과 같은 배치
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener("keydown", (e) => {
  if (Sheets.stack.length) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (S.page === "select") {
    if (e.key === "ArrowLeft" || e.key === "1") { e.preventDefault(); decide("keep"); }
    if (e.key === "ArrowRight" || e.key === "2") { e.preventDefault(); decide("drop"); }
  } else if (S.page === "match") {
    if (e.key === "n" || e.key === "N") { e.preventDefault(); matchPick(null, null, null, true); }
  }
});

const Tour = {
  i: -1, on: false,
  node: $("#tour"), card: $("#tour-card"), ring: $("#tour-ring"),
  hole: $("#spot-hole"),
  start(from) {
    // 안내는 처음 화면부터 순서대로 이어지므로, 다시 볼 때는 앱도 처음으로 되돌린다 —
    // 그러지 않으면 '폴더를 고르세요' 단계가 이미 지나간 화면을 가리킨다.
    if (!from) { resetAll(); STEPS.forEach((s) => { s.done = false; }); }
    this.on = true; this.node.classList.add("on");
    this.show(from || 0);
  },
  stop() { this.on = false; this.node.classList.remove("on"); },
  show(i) {
    if (i < 0 || i >= STEPS.length) return this.stop();
    this.i = i;
    const s = STEPS[i];
    $("#tour-title").textContent = s.t;
    $("#tour-step").textContent = (i + 1) + " / " + STEPS.length;
    $("#tour-body").innerHTML = s.b;
    this.card.setAttribute("data-kind", s.kind || "info");
    $("#tour-prev").disabled = i === 0;
    const next = $("#tour-next");
    next.textContent = s.act ? (s.actLabel || "해 보기") : (i === STEPS.length - 1 ? "끝내기" : "다음");
    this.reposition();
  },
  reposition() {
    if (!this.on) return;
    const s = STEPS[this.i];
    const node = s && s.sel ? document.querySelector(s.sel) : null;
    const card = this.card, pad = 6;
    if (!node) {
      this.hole.setAttribute("width", 0); this.hole.setAttribute("height", 0);
      this.ring.style.opacity = "0";
      card.style.left = Math.max(16, (window.innerWidth - card.offsetWidth) / 2) + "px";
      card.style.top = Math.max(16, (window.innerHeight - card.offsetHeight) / 2) + "px";
      return;
    }
    const r = node.getBoundingClientRect();
    this.hole.setAttribute("x", r.left - pad); this.hole.setAttribute("y", r.top - pad);
    this.hole.setAttribute("width", r.width + pad * 2); this.hole.setAttribute("height", r.height + pad * 2);
    this.ring.style.opacity = "1";
    this.ring.style.left = (r.left - pad) + "px"; this.ring.style.top = (r.top - pad) + "px";
    this.ring.style.width = (r.width + pad * 2) + "px"; this.ring.style.height = (r.height + pad * 2) + "px";
    // 카드 자리 — 대상 아래가 기본이고, 화면을 벗어나거나 **열린 시트를 가리면** 옆으로
    // 비킨다.  안내를 읽으려고 정작 눌러야 할 창을 못 보는 일이 없게 한다.
    const cw = card.offsetWidth || 430, ch = card.offsetHeight || 210;
    const vw = window.innerWidth, vh = window.innerHeight, gap = 14;
    const top0 = Sheets.stack[Sheets.stack.length - 1];
    const sheetEl = top0 ? top0.sheet : null;
    // 대상이 시트 안에 있으면 시트를 피할 수 없다(피하면 대상도 못 본다).
    const avoid = sheetEl && !sheetEl.contains(node)
      ? sheetEl.getBoundingClientRect() : null;
    const fits = (x, y) => x >= 8 && y >= 8 && x + cw <= vw - 8 && y + ch <= vh - 8;
    const clear = (x, y) => !avoid ||
      x + cw < avoid.left - 4 || x > avoid.right + 4 ||
      y + ch < avoid.top - 4 || y > avoid.bottom + 4;
    const near = Math.min(Math.max(12, r.left), vw - cw - 12);
    const cands = [[near, r.bottom + gap], [near, r.top - ch - gap]];
    if (avoid) cands.push(
      [avoid.right + gap, Math.max(12, avoid.top)],
      [avoid.left - cw - gap, Math.max(12, avoid.top)],
      [Math.max(12, (vw - cw) / 2), avoid.bottom + gap],
      [Math.max(12, (vw - cw) / 2), avoid.top - ch - gap]);
    const pick = cands.find(([x, y]) => fits(x, y) && clear(x, y))
      || cands.find(([x, y]) => fits(x, y)) || cands[0];
    // 어떤 후보를 고르든 **화면 안**에 둔다 — 마지막 폴백이 음수 좌표가 되어 카드가
    // 화면 밖으로 나가면 [다음] 을 누를 수 없어 안내가 그 자리에서 끝난다.
    card.style.left = Math.round(Math.min(Math.max(8, pick[0]), vw - cw - 8)) + "px";
    card.style.top = Math.round(Math.min(Math.max(8, pick[1]), vh - ch - 8)) + "px";
  },
  async next() {
    const s = STEPS[this.i];
    // ★ 동작이 있는 단계는 **한 번만** 실행한다.  예전에는 실행 뒤 act 를 되돌려 놓아
    //   같은 버튼이 두 번 눌렸다([검증 시작]이 두 번 나가는 식).
    if (s && s.act && !s.done) {
      const here = this.i;
      s.done = true;
      $("#tour-next").disabled = true;
      try { s.act(); } catch (err) { console.warn("안내 동작을 건너뜁니다:", err); }
      await wait(s.wait || 400);
      if (this.i !== here) return;      // 기다리는 동안 단계가 바뀌었으면 손대지 않는다
      $("#tour-next").disabled = false;
      this.reposition();
      $("#tour-next").textContent = here === STEPS.length - 1 ? "끝내기" : "다음";
      // ★ 동작을 한 뒤에는 **언제나 이 단계에 머문다** — 결과를 보고 한 번 더 눌러야
      //   넘어간다.  조건부로 넘기면 기다리는 사이에 들어온 클릭과 겹쳐 한 단계가
      //   통째로 건너뛰어졌다(검증에서 잡힌 실제 증상).
      return;
    }
    this.show(this.i + 1);
  },
};
$("#tour-next").addEventListener("click", () => Tour.next());
$("#tour-prev").addEventListener("click", () => Tour.show(Tour.i - 1));
$("#tour-skip").addEventListener("click", () => Tour.stop());

    ["잘못 짝지어진 것을 빼내고 싶다", "매칭 결과 검토", "[삭제] 표시 후 [확인] 을 눌러야 실제로 빠집니다."],
    ["짝을 못 찾은 사진을 직접 짝지어 주고 싶다", "매치 실패 사진 검토", "넘길 때마다 몇 초 멈출 수 있습니다."],
    ["결과를 남기고 싶다", "엑셀로 저장", "요약에 적힌 위치에 저장됩니다."],

function openHelp() {
  const order = ORDER.filter((k) => HELP[k]);
  const body = [el("p", { class: "small muted", text:
    "지금 화면(굵은 제목)부터 순서대로 정리했습니다. 실제 프로그램에서도 같습니다." })];
  for (const key of [S.page].concat(order.filter((k) => k !== S.page))) {
    const [title, rows] = HELP[key];
    body.push(el("h3", { text: title, style: key === S.page ? "" : "color:var(--mute)" }));
    const tbl = el("div", { style: "display:flex;flex-direction:column;gap:2px" });
    rows.forEach(([sit, btn, then]) => tbl.appendChild(
      el("div", { class: "row", style:
        "gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line2)" }, [
        el("span", { style: "flex:1.1", text: sit }),
        el("span", { style: "flex:.7;font-weight:700", text: btn === "—" ? "—" : "[" + btn + "]" }),
        el("span", { class: "muted", style: "flex:1.4", text: then }),
      ])));
    body.push(tbl);
  }
  Sheets.open({ title: "이럴 땐 이 버튼", body, full: true });
}
$("#btn-help").addEventListener("click", () => openHelp());
